name: Client CI

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - 'client/**'

  pull_request:
    branches:
      - main
    paths:
      - 'client/**'

jobs:
  lint-and-build:
    name: Lint & Build (Client)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist/
          retention-days: 7